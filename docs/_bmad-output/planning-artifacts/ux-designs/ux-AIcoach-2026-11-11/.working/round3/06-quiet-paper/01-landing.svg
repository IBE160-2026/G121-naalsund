<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2696" viewBox="0 0 1440 2696"><title>AIcoach — Landing (Quiet Paper)</title><rect x="0" y="0" width="1440" height="2696" fill="#F4EFE6" /><circle cx="414" cy="60" r="14.3" fill="#A4462A"/><path d="M410.42 67.15 L410.42 52.13 L420.43 55.71 L410.42 59.29" fill="#F4EFE6" stroke="#F4EFE6" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round"/><path d="M405.42 67.44 Q414 64.29 422.58 67.44" fill="none" stroke="#F4EFE6" stroke-width="1.43" stroke-linecap="round"/><text x="434.8" y="68.32" font-family="Newsreader, Georgia, serif" font-size="26" font-weight="600" fill="#25201B"><tspan fill="#A4462A" font-style="italic">AI</tspan><tspan>coach</tspan></text><text x="1040" y="66" font-family="Figtree, Arial, sans-serif" font-size="15" font-weight="600" fill="#25201B">Sign in</text><text x="400" y="236" font-family="Newsreader, Georgia, serif" font-size="56" font-weight="400" fill="#25201B"><tspan x="400" dy="0">Send one swing.</tspan><tspan x="400" dy="64">Hear what a coach</tspan><tspan x="400" dy="64">would tell you.</tspan></text><text x="400" y="410" font-family="Figtree, Arial, sans-serif" font-size="19" fill="#62584D"><tspan x="400" dy="0">Film one down-the-line swing on your phone. AIcoach names</tspan><tspan x="400" dy="30">the fault, says how sure it is, and gives you one thing to practise.</tspan></text><rect x="400" y="486" width="184" height="54" rx="27" fill="#A4462A"/><text x="492" y="518.6" font-family="Figtree, Arial, sans-serif" font-size="16" font-weight="600" fill="#F4EFE6" text-anchor="middle">Create account</text><text x="612" y="519" font-family="Figtree, Arial, sans-serif" font-size="16" font-weight="600" fill="#25201B" text-decoration="underline">See an example</text><text x="400" y="660" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="600" fill="#62584D" letter-spacing="1.4">EXAMPLE RESULT  ·  RORY, 7-IRON, 11 NOV</text><line x1="499.1" y1="1140" x2="931.5" y2="1140" stroke="#62584D" stroke-width="1" opacity="0.5"/><circle cx="875.1" cy="1131.5" r="5.6" fill="#FFFCF6" stroke="#25201B" stroke-width="1"/><path d="M708.3 789.9L673.9 822.3M673.9 822.3L574.3 905M574.3 905L621.3 1012.2M621.3 1012.2L593.1 1123.1M593.1 1123.1L629.8 1138.1M593.1 1123.1L580.9 1138.1M673.9 822.3L669.7 832.6M669.7 832.6L687.1 891.8M687.1 891.8L711.5 943.5" fill="none" stroke="#62584D" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><line x1="574.3" y1="735.8" x2="574.3" y2="1140" stroke="#62584D" stroke-width="1" stroke-dasharray="5 4"/><line x1="685.2" y1="807.2" x2="607.2" y2="894.7" stroke="#EBE3D5" stroke-width="51.7" stroke-linecap="round"/><line x1="607.2" y1="894.7" x2="645.7" y2="1004.6" stroke="#EBE3D5" stroke-width="35.3" stroke-linecap="round"/><line x1="645.7" y1="1004.6" x2="598.7" y2="1116.5" stroke="#EBE3D5" stroke-width="25.9" stroke-linecap="round"/><line x1="685.2" y1="807.2" x2="680.5" y2="816.6" stroke="#EBE3D5" stroke-width="32.9" stroke-linecap="round"/><line x1="680.5" y1="816.6" x2="699.3" y2="878.7" stroke="#EBE3D5" stroke-width="23.5" stroke-linecap="round"/><line x1="699.3" y1="878.7" x2="719.1" y2="938.8" stroke="#EBE3D5" stroke-width="18.8" stroke-linecap="round"/><line x1="716.2" y1="777.2" x2="685.2" y2="807.2" stroke="#EBE3D5" stroke-width="28.2" stroke-linecap="round"/><circle cx="716.2" cy="777.2" r="24.4" fill="#EBE3D5"/><line x1="719.1" y1="938.8" x2="857.2" y2="1136.2" stroke="#62584D" stroke-width="1.2800000000000002" /><path d="M716.2 777.2L685.2 807.2M685.2 807.2L607.2 894.7M607.2 894.7L645.7 1004.6M645.7 1004.6L598.7 1116.5M598.7 1116.5L632.6 1138.1M598.7 1116.5L593.1 1124M685.2 807.2L680.5 816.6M680.5 816.6L699.3 878.7M699.3 878.7L719.1 938.8" fill="none" stroke="#25201B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="716.2" cy="777.2" r="4.9350000000000005" fill="#F4EFE6" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="685.2" cy="807.2" r="4.9350000000000005" fill="#F4EFE6" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="680.5" cy="816.6" r="4.9350000000000005" fill="#F4EFE6" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="699.3" cy="878.7" r="4.9350000000000005" fill="#F4EFE6" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="719.1" cy="938.8" r="4.9350000000000005" fill="#F4EFE6" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="645.7" cy="1004.6" r="4.9350000000000005" fill="#F4EFE6" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="598.7" cy="1116.5" r="4.9350000000000005" fill="#F4EFE6" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="632.6" cy="1138.1" r="4.9350000000000005" fill="#F4EFE6" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="593.1" cy="1124" r="4.9350000000000005" fill="#F4EFE6" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="607.2" cy="894.7" r="10.4" fill="none" stroke="#1E5368" stroke-width="1.2"/><circle cx="607.2" cy="894.7" r="6.2" fill="#1E5368"/><line x1="574.3" y1="894.7" x2="601.2" y2="894.7" stroke="#1E5368" stroke-width="1.6" /><path d="M597.2 890.7 L602.2 894.7 L597.2 898.7" fill="none" stroke="#1E5368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="564.3" y="754.6" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#62584D" text-anchor="end">address</text><text x="564.3" y="899.7" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#1E5368" text-anchor="end">7%</text><text x="400" y="1166" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#1E5368">[1] hip position, address → impact</text><text x="884.5" y="1166" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#62584D" text-anchor="end">impact</text><text x="400" y="1232" font-family="Newsreader, Georgia, serif" font-size="40" font-weight="500" fill="#25201B">Early extension</text><rect x="400" y="1257.2" width="4" height="10.799999999999999" fill="#2D6A4A" rx="1"/><rect x="406" y="1257.2" width="4" height="10.799999999999999" fill="#2D6A4A" rx="1"/><rect x="412" y="1257.2" width="4" height="10.799999999999999" fill="#2D6A4A" rx="1"/><text x="424" y="1268" font-family="Figtree, Arial, sans-serif" font-size="15" font-weight="600" fill="#2D6A4A">confidence: high</text><text x="568" y="1268" font-family="Figtree, Arial, sans-serif" font-size="15" fill="#62584D">verified</text><text x="400" y="1330" font-family="Newsreader, Georgia, serif" font-size="22" fill="#25201B"><tspan x="400" dy="0"><tspan>Your hips moved </tspan><tspan font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#1E5368">7% of body height</tspan><tspan dy="-7" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600" fill="#1E5368">[1]</tspan><tspan dy="7"> toward the ball.</tspan></tspan><tspan x="400" dy="32">My rule for early extension starts at 4%.</tspan></text><text x="400" y="1424" font-family="Newsreader, Georgia, serif" font-size="22" font-style="italic" fill="#A4462A"><tspan x="400" dy="0">It may feel like you stay down, but at impact</tspan><tspan x="400" dy="32">your hips have moved toward the ball.</tspan></text><text x="400" y="1686" font-family="Newsreader, Georgia, serif" font-size="36" fill="#25201B">When it can’t tell, it says so.</text><text x="400" y="1776" font-family="Figtree, Arial, sans-serif" font-size="19" font-weight="600" fill="#25201B">Cannot analyse</text><text x="400" y="1806" font-family="Figtree, Arial, sans-serif" font-size="16" fill="#62584D">No guessing from bad video.</text><text x="400" y="1868" font-family="Figtree, Arial, sans-serif" font-size="19" font-weight="600" fill="#25201B">No verified fault found</text><text x="400" y="1898" font-family="Figtree, Arial, sans-serif" font-size="16" fill="#62584D">No fault forced on a good swing.</text><text x="400" y="1960" font-family="Figtree, Arial, sans-serif" font-size="19" font-weight="600" fill="#25201B">Unverified — confirm with a coach</text><text x="400" y="1990" font-family="Figtree, Arial, sans-serif" font-size="16" fill="#62584D">Anything outside its rule table.</text><line x1="400" y1="1968" x2="718" y2="1968" stroke="#62584D" stroke-width="1" stroke-dasharray="4 3"/><rect x="900" y="1949.92" width="4" height="10.08" fill="#8E3F33" rx="1"/><rect x="906.5" y="1950.42" width="3" height="9.08" fill="none" stroke="#8E3F33" stroke-width="1" rx="1"/><rect x="912.5" y="1950.42" width="3" height="9.08" fill="none" stroke="#8E3F33" stroke-width="1" rx="1"/><text x="924" y="1960" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600" fill="#8E3F33">confidence: low</text><text x="400" y="2190" font-family="Newsreader, Georgia, serif" font-size="36" fill="#25201B">Film. Send. Read.</text><text x="400" y="2270" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="500" fill="#A4462A">1</text><text x="440" y="2270" font-family="Figtree, Arial, sans-serif" font-size="18" fill="#25201B"><tspan x="440" dy="0">Film one swing from behind, phone at hand height.</tspan></text><text x="400" y="2326" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="500" fill="#A4462A">2</text><text x="440" y="2326" font-family="Figtree, Arial, sans-serif" font-size="18" fill="#25201B"><tspan x="440" dy="0">Send the clip. The answer takes about a minute.</tspan></text><text x="400" y="2382" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="500" fill="#A4462A">3</text><text x="440" y="2382" font-family="Figtree, Arial, sans-serif" font-size="18" fill="#25201B"><tspan x="440" dy="0">Read the verdict on three faults: early extension,</tspan><tspan x="440" dy="28">loss of posture and over the top.</tspan></text><rect x="400" y="2492" width="184" height="54" rx="27" fill="#A4462A"/><text x="492" y="2524.6" font-family="Figtree, Arial, sans-serif" font-size="16" font-weight="600" fill="#F4EFE6" text-anchor="middle">Create account</text><text x="612" y="2525" font-family="Figtree, Arial, sans-serif" font-size="15" fill="#62584D">Your clips stay private.</text><text x="400" y="2640" font-family="Figtree, Arial, sans-serif" font-size="12.5" fill="#62584D">A practice tool, not for competitive rounds. Mobility exercises are generic guidance, not medical advice.</text></svg>
