<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3845" viewBox="0 0 1440 3845"><title>AIcoach — Result and coach chat (Quiet Paper)</title><rect x="0" y="0" width="1440" height="3845" fill="#F4EFE6" /><circle cx="414" cy="60" r="14.3" fill="#A4462A"/><path d="M410.42 67.15 L410.42 52.13 L420.43 55.71 L410.42 59.29" fill="#F4EFE6" stroke="#F4EFE6" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round"/><path d="M405.42 67.44 Q414 64.29 422.58 67.44" fill="none" stroke="#F4EFE6" stroke-width="1.43" stroke-linecap="round"/><text x="434.8" y="68.32" font-family="Newsreader, Georgia, serif" font-size="26" font-weight="600" fill="#25201B"><tspan fill="#A4462A" font-style="italic">AI</tspan><tspan>coach</tspan></text><text x="988" y="66" font-family="Figtree, Arial, sans-serif" font-size="15" fill="#62584D" text-anchor="end">Swing library</text><circle cx="1024" cy="60" r="16" fill="#EBE3D5"/><text x="1024" y="65" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600" fill="#25201B" text-anchor="middle">R</text><text x="400" y="190" font-family="Figtree, Arial, sans-serif" font-size="14" fill="#62584D">7-iron  ·  Tue 11 Nov 2026  ·  120 fps  ·  down the line</text><text x="400" y="282" font-family="Newsreader, Georgia, serif" font-size="60" fill="#25201B">Early extension</text><rect x="400" y="314.48" width="4" height="11.52" fill="#2D6A4A" rx="1"/><rect x="406" y="314.48" width="4" height="11.52" fill="#2D6A4A" rx="1"/><rect x="412" y="314.48" width="4" height="11.52" fill="#2D6A4A" rx="1"/><text x="424" y="326" font-family="Figtree, Arial, sans-serif" font-size="16" font-weight="600" fill="#2D6A4A">confidence: high</text><text x="578" y="326" font-family="Figtree, Arial, sans-serif" font-size="16" fill="#62584D">verified fault</text><text x="400" y="402" font-family="Newsreader, Georgia, serif" font-size="23" fill="#25201B"><tspan x="400" dy="0"><tspan>Your hips moved </tspan><tspan font-family="IBM Plex Mono, Consolas, monospace" font-size="19" font-weight="500" fill="#1E5368">7% of body height</tspan><tspan dy="-7" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600" fill="#1E5368">[1]</tspan><tspan dy="7"> toward the</tspan></tspan><tspan x="400" dy="34">ball through impact. My rule for early extension</tspan><tspan x="400" dy="34">starts at 4%.</tspan></text><rect x="372" y="530" width="696" height="560" fill="#E2ECEC" rx="22"/><path d="M730 530 l10 -10 l10 10 Z" fill="#E2ECEC"/><rect x="400" y="562" width="22" height="22" fill="#1E5368" rx="5"/><text x="411" y="578" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="600" fill="#FFFCF6" text-anchor="middle">1</text><text x="434" y="579" font-family="Figtree, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E5368">Hips toward the ball</text><text x="1040" y="579" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E5368" text-anchor="end" text-decoration="underline">Close</text><line x1="406" y1="920" x2="700.4" y2="920" stroke="#62584D" stroke-width="1" opacity="0.5"/><circle cx="662" cy="914" r="3.6" fill="#E2ECEC" stroke="#25201B" stroke-width="1"/><line x1="457.2" y1="644.8" x2="457.2" y2="920" stroke="#62584D" stroke-width="1" stroke-dasharray="5 4"/><line x1="550.6" y1="786.2" x2="649.2" y2="917.4" stroke="#62584D" stroke-width="1.2800000000000002" /><path d="M548.4 681.6L525 703.7M525 703.7L457.2 760M457.2 760L489.2 833M489.2 833L470 908.5M470 908.5L495 918.7M470 908.5L461.7 918.7M525 703.7L522.2 710.7M522.2 710.7L534 751M534 751L550.6 786.2" fill="none" stroke="#25201B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="548.4" cy="681.6" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="525" cy="703.7" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="522.2" cy="710.7" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="534" cy="751" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="550.6" cy="786.2" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="489.2" cy="833" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="470" cy="908.5" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="495" cy="918.7" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="461.7" cy="918.7" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="457.2" cy="760" r="7.1" fill="none" stroke="#1E5368" stroke-width="1.2"/><circle cx="457.2" cy="760" r="4.2" fill="#1E5368"/><line x1="726" y1="920" x2="1020.4" y2="920" stroke="#62584D" stroke-width="1" opacity="0.5"/><circle cx="982" cy="914.2" r="3.8" fill="#E2ECEC" stroke="#25201B" stroke-width="1"/><path d="M868.4 681.6L845 703.7M845 703.7L777.2 760M777.2 760L809.2 833M809.2 833L790 908.5M790 908.5L815 918.7M790 908.5L781.7 918.7M845 703.7L842.2 710.7M842.2 710.7L854 751M854 751L870.6 786.2" fill="none" stroke="#62584D" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><line x1="777.2" y1="644.8" x2="777.2" y2="920" stroke="#62584D" stroke-width="1" stroke-dasharray="5 4"/><line x1="875.8" y1="783" x2="969.8" y2="917.4" stroke="#62584D" stroke-width="1.2800000000000002" /><path d="M873.8 673L852.7 693.4M852.7 693.4L799.6 753M799.6 753L825.8 827.8M825.8 827.8L793.8 904M793.8 904L816.9 918.7M793.8 904L790 909.1M852.7 693.4L849.5 699.8M849.5 699.8L862.3 742.1M862.3 742.1L875.8 783" fill="none" stroke="#25201B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="873.8" cy="673" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="852.7" cy="693.4" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="849.5" cy="699.8" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="862.3" cy="742.1" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="875.8" cy="783" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="825.8" cy="827.8" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="793.8" cy="904" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="816.9" cy="918.7" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="790" cy="909.1" r="3.3600000000000003" fill="#E2ECEC" stroke="#25201B" stroke-width="1.2000000000000002"/><circle cx="799.6" cy="753" r="7.1" fill="none" stroke="#1E5368" stroke-width="1.2"/><circle cx="799.6" cy="753" r="4.2" fill="#1E5368"/><line x1="777.2" y1="753" x2="793.6" y2="753" stroke="#1E5368" stroke-width="1.6" /><path d="M789.6 749 L794.6 753 L789.6 757" fill="none" stroke="#1E5368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="457.2" y="950" font-family="IBM Plex Mono, Consolas, monospace" font-size="12.5" fill="#62584D">address  0.86 s</text><text x="777.2" y="950" font-family="IBM Plex Mono, Consolas, monospace" font-size="12.5" fill="#62584D">impact  2.07 s</text><text x="767.2" y="758" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" font-weight="600" fill="#1E5368" text-anchor="end">7%</text><text x="400" y="1020" font-family="IBM Plex Mono, Consolas, monospace" font-size="44" font-weight="500" fill="#1E5368">7%</text><text x="496" y="1000" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" fill="#1E5368"><tspan x="496" dy="0">of body height, address → impact</tspan><tspan x="496" dy="20">rule 4%  ·  dashed line = hips at address</tspan></text><rect x="878" y="1003.92" width="4" height="10.08" fill="#2D6A4A" rx="1"/><rect x="884" y="1003.92" width="4" height="10.08" fill="#2D6A4A" rx="1"/><rect x="890" y="1003.92" width="4" height="10.08" fill="#2D6A4A" rx="1"/><text x="902" y="1014" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600" fill="#2D6A4A">confidence: high</text><text x="400" y="1240" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="600" fill="#62584D" letter-spacing="1.4">FEEL CUE</text><text x="400" y="1296" font-family="Newsreader, Georgia, serif" font-size="34" font-style="italic" fill="#A4462A"><tspan x="400" dy="0">It may feel like you stay down, but at</tspan><tspan x="400" dy="46">impact your hips have moved toward</tspan><tspan x="400" dy="46">the ball.</tspan></text><text x="400" y="1548" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="600" fill="#62584D" letter-spacing="1.4">WHY IT HAPPENS</text><text x="400" y="1596" font-family="Newsreader, Georgia, serif" font-size="21" fill="#25201B"><tspan x="400" dy="0">On the way down your hips slide toward the ball, so</tspan><tspan x="400" dy="33">your chest stands up to make room for your arms.</tspan><tspan x="400" dy="33"><tspan>The likely reason: your lead hip turns </tspan><tspan font-family="IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="500" fill="#1E5368">31°</tspan><tspan dy="-7" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600" fill="#1E5368">[2]</tspan><tspan dy="7"> at impact,</tspan></tspan><tspan x="400" dy="33">where about 45° is typical.</tspan></text><text x="400" y="1845" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="600" fill="#62584D" letter-spacing="1.4">FROM CAUSE TO FAULT</text><line x1="409" y1="1915" x2="409" y2="1983" stroke="#62584D" stroke-width="1.4" stroke-dasharray="4 4"/><circle cx="409" cy="1901" r="8" fill="none" stroke="#62584D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="440" y="1907" font-family="Figtree, Arial, sans-serif" font-size="19" font-weight="600" fill="#25201B">Restricted hip rotation</text><text x="440" y="1933" font-family="Figtree, Arial, sans-serif" font-size="15" fill="#62584D"><tspan>likely cause  ·  lead hip turned </tspan><tspan font-family="IBM Plex Mono, Consolas, monospace" font-weight="500" fill="#1E5368">31°</tspan><tspan dy="-7" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600" fill="#1E5368">[2]</tspan></text><rect x="878" y="1896.92" width="4" height="10.08" fill="#8C5D0F" rx="1"/><rect x="884" y="1896.92" width="4" height="10.08" fill="#8C5D0F" rx="1"/><rect x="890.5" y="1897.42" width="3" height="9.08" fill="none" stroke="#8C5D0F" stroke-width="1" rx="1"/><text x="902" y="1907" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600" fill="#8C5D0F">confidence: medium</text><line x1="409" y1="2011" x2="409" y2="2079" stroke="#62584D" stroke-width="1.4" /><circle cx="409" cy="1997" r="8" fill="#F4EFE6" stroke="#25201B" stroke-width="1.8"/><text x="440" y="2003" font-family="Figtree, Arial, sans-serif" font-size="19" font-weight="600" fill="#25201B">Hips move toward the ball</text><text x="440" y="2029" font-family="Figtree, Arial, sans-serif" font-size="15" fill="#62584D"><tspan>measured  ·  </tspan><tspan font-family="IBM Plex Mono, Consolas, monospace" font-weight="500" fill="#1E5368">7% of body height</tspan><tspan dy="-7" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600" fill="#1E5368">[1]</tspan></text><rect x="878" y="1992.92" width="4" height="10.08" fill="#2D6A4A" rx="1"/><rect x="884" y="1992.92" width="4" height="10.08" fill="#2D6A4A" rx="1"/><rect x="890" y="1992.92" width="4" height="10.08" fill="#2D6A4A" rx="1"/><text x="902" y="2003" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600" fill="#2D6A4A">confidence: high</text><circle cx="409" cy="2093" r="9" fill="#25201B"/><text x="440" y="2099" font-family="Figtree, Arial, sans-serif" font-size="19" font-weight="600" fill="#25201B">Early extension</text><text x="440" y="2125" font-family="Figtree, Arial, sans-serif" font-size="15" fill="#62584D">verified by the rule table</text><rect x="878" y="2088.92" width="4" height="10.08" fill="#2D6A4A" rx="1"/><rect x="884" y="2088.92" width="4" height="10.08" fill="#2D6A4A" rx="1"/><rect x="890" y="2088.92" width="4" height="10.08" fill="#2D6A4A" rx="1"/><text x="902" y="2099" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600" fill="#2D6A4A">confidence: high</text><text x="400" y="2273" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="600" fill="#62584D" letter-spacing="1.4">PRACTISE</text><text x="400" y="2331" font-family="Newsreader, Georgia, serif" font-size="32" fill="#25201B">Wall drill</text><text x="1040" y="2331" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#A4462A" text-anchor="end">3 × 10</text><text x="400" y="2367" font-family="Figtree, Arial, sans-serif" font-size="17" fill="#25201B"><tspan x="400" dy="0">Backside on a wall or golf bag. Slow half swings,</tspan><tspan x="400" dy="27">trail glute stays on the wall through impact.</tspan></text><text x="400" y="2481" font-family="Newsreader, Georgia, serif" font-size="32" fill="#25201B">90/90 hip rotation</text><text x="1040" y="2481" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="500" fill="#A4462A" text-anchor="end">2 × 8 each side</text><text x="400" y="2517" font-family="Figtree, Arial, sans-serif" font-size="17" fill="#25201B">Sit with both knees at 90°. Turn slowly side to side.</text><text x="400" y="2551" font-family="Figtree, Arial, sans-serif" font-size="14" fill="#62584D">Generic guidance, not medical advice — see a physiotherapist if you feel pain.</text><text x="400" y="2721" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="600" fill="#62584D" letter-spacing="1.4">ALSO CHECKED</text><text x="400" y="2775" font-family="Figtree, Arial, sans-serif" font-size="19" font-weight="600" fill="#25201B">Loss of posture</text><text x="552" y="2775" font-family="Figtree, Arial, sans-serif" font-size="17" font-weight="600" fill="#8C5D0F">possible</text><rect x="878" y="2764.92" width="4" height="10.08" fill="#8C5D0F" rx="1"/><rect x="884" y="2764.92" width="4" height="10.08" fill="#8C5D0F" rx="1"/><rect x="890.5" y="2765.42" width="3" height="9.08" fill="none" stroke="#8C5D0F" stroke-width="1" rx="1"/><text x="902" y="2775" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600" fill="#8C5D0F">confidence: medium</text><text x="400" y="2803" font-family="Figtree, Arial, sans-serif" font-size="15.5" fill="#62584D"><tspan>Posture angle changed </tspan><tspan font-family="IBM Plex Mono, Consolas, monospace" font-weight="500" fill="#1E5368">6°</tspan><tspan dy="-7" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600" fill="#1E5368">[3]</tspan><tspan dy="7">. A fault starts at 9°. No drill yet.</tspan></text><text x="400" y="2859" font-family="Figtree, Arial, sans-serif" font-size="19" font-weight="600" fill="#25201B">Over the top</text><text x="524" y="2859" font-family="Figtree, Arial, sans-serif" font-size="17" fill="#62584D">not found</text><rect x="878" y="2848.92" width="4" height="10.08" fill="#8C5D0F" rx="1"/><rect x="884" y="2848.92" width="4" height="10.08" fill="#8C5D0F" rx="1"/><rect x="890.5" y="2849.42" width="3" height="9.08" fill="none" stroke="#8C5D0F" stroke-width="1" rx="1"/><text x="902" y="2859" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600" fill="#8C5D0F">confidence: medium</text><text x="400" y="2887" font-family="Figtree, Arial, sans-serif" font-size="15.5" fill="#62584D">Capped at medium: measured from the hand path only.</text><text x="400" y="3067" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="600" fill="#62584D" letter-spacing="1.4">ASK THE COACH</text><rect x="536" y="3058" width="11" height="9" rx="1.5" fill="#1E5368"/><path d="M538.5 3058 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#1E5368" stroke-width="1.4"/><text x="554" y="3067" font-family="Figtree, Arial, sans-serif" font-size="13.5" fill="#1E5368">Answers are based only on this analysis.</text><rect x="610" y="3113" width="430" height="66" fill="#25201B" rx="22"/><text x="634" y="3141" font-family="Figtree, Arial, sans-serif" font-size="15.5" fill="#F4EFE6"><tspan x="634" dy="0">Why does it feel like I’m staying down</tspan><tspan x="634" dy="21">when I’m not?</tspan></text><circle cx="409" cy="3205" r="9.01" fill="#A4462A"/><path d="M406.75 3209.5 L406.75 3200.05 L413.05 3202.3 L406.75 3204.55" fill="#F4EFE6" stroke="#F4EFE6" stroke-width="1.08" stroke-linecap="round" stroke-linejoin="round"/><path d="M403.59 3209.68 Q409 3207.7 414.41 3209.68" fill="none" stroke="#F4EFE6" stroke-width="0.9" stroke-linecap="round"/><text x="426" y="3211" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="600" font-style="italic" fill="#A4462A">Coach</text><text x="400" y="3249" font-family="Newsreader, Georgia, serif" font-size="21" fill="#25201B"><tspan x="400" dy="0">The move happens below your eye line, so you don’t</tspan><tspan x="400" dy="33"><tspan>see it. Your hips moved </tspan><tspan font-family="IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="500" fill="#1E5368">7%</tspan><tspan dy="-7" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600" fill="#1E5368">[1]</tspan><tspan dy="7"> toward the ball, and the</tspan></tspan><tspan x="400" dy="33">impact frame shows the gap. The wall drill turns it</tspan><tspan x="400" dy="33">into something you can feel.</tspan></text><text x="400" y="3387" font-family="IBM Plex Mono, Consolas, monospace" font-size="12.5" fill="#1E5368">Based on: [1] hip movement  ·  impact frame  ·  wall drill</text><text x="400" y="3451" font-family="Figtree, Arial, sans-serif" font-size="15" fill="#62584D">Try: </text><text x="436" y="3451" font-family="Figtree, Arial, sans-serif" font-size="15" font-weight="500" fill="#25201B" text-decoration="underline">How do I know the drill is working?</text><text x="436" y="3481" font-family="Figtree, Arial, sans-serif" font-size="15" font-weight="500" fill="#25201B" text-decoration="underline">Can I do this drill in a net?</text><rect x="400" y="3517" width="640" height="58" fill="#EBE3D5" rx="29"/><text x="426" y="3552" font-family="Figtree, Arial, sans-serif" font-size="16" fill="#62584D">Ask about this result…</text><circle cx="1011" cy="3546" r="20" fill="#A4462A"/><path d="M1004 3546 h13 M1011 3540 l6 6 l-6 6" fill="none" stroke="#F4EFE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="400" y1="3655" x2="1040" y2="3655" stroke="#EBE3D5" stroke-width="1.5" /><rect x="400" y="3697" width="44" height="26" rx="13" fill="#62584D" opacity="0.28"/><circle cx="413" cy="3710" r="10" fill="#FFFCF6"/><text x="462" y="3715" font-family="Figtree, Arial, sans-serif" font-size="16" font-weight="600" fill="#25201B">Save to my swing library</text><text x="462" y="3739" font-family="Figtree, Arial, sans-serif" font-size="14" fill="#62584D">Off. If on, the clip is stored on the AIcoach server until you delete it.</text></svg>
