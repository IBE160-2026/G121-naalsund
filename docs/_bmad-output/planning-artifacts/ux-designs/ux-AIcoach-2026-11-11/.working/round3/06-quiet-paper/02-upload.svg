<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2204" viewBox="0 0 1440 2204"><title>AIcoach — Upload and analysing (Quiet Paper)</title><rect x="0" y="0" width="1440" height="2204" fill="#F4EFE6" /><text x="40" y="140" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="700" fill="#62584D">Upload</text><text x="40" y="160" font-family="Figtree, Arial, sans-serif" font-size="13" fill="#62584D">One column, two quiet sections.</text><circle cx="414" cy="60" r="14.3" fill="#A4462A"/><path d="M410.42 67.15 L410.42 52.13 L420.43 55.71 L410.42 59.29" fill="#F4EFE6" stroke="#F4EFE6" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round"/><path d="M405.42 67.44 Q414 64.29 422.58 67.44" fill="none" stroke="#F4EFE6" stroke-width="1.43" stroke-linecap="round"/><text x="434.8" y="68.32" font-family="Newsreader, Georgia, serif" font-size="26" font-weight="600" fill="#25201B"><tspan fill="#A4462A" font-style="italic">AI</tspan><tspan>coach</tspan></text><text x="988" y="66" font-family="Figtree, Arial, sans-serif" font-size="15" fill="#62584D" text-anchor="end">Swing library</text><circle cx="1024" cy="60" r="16" fill="#EBE3D5"/><text x="1024" y="65" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600" fill="#25201B" text-anchor="middle">R</text><text x="400" y="210" font-family="Newsreader, Georgia, serif" font-size="40" fill="#25201B">Send me one swing.</text><text x="400" y="250" font-family="Newsreader, Georgia, serif" font-size="20" fill="#62584D">Filmed from behind, along the target line.</text><text x="400" y="340" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="600" fill="#62584D" letter-spacing="1.4">BEFORE YOU PRESS RECORD</text><text x="400" y="386" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#62584D">1</text><text x="432" y="386" font-family="Figtree, Arial, sans-serif" font-size="17" fill="#25201B">Down the line only</text><text x="400" y="428" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#62584D">2</text><text x="432" y="428" font-family="Figtree, Arial, sans-serif" font-size="17" fill="#25201B">Phone at hand height, level</text><text x="400" y="470" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#62584D">3</text><text x="432" y="470" font-family="Figtree, Arial, sans-serif" font-size="17" fill="#25201B">2.4–3.7 m behind your hands</text><text x="400" y="512" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#62584D">4</text><text x="432" y="512" font-family="Figtree, Arial, sans-serif" font-size="17" fill="#25201B">120 fps if your phone has it</text><text x="400" y="554" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#62584D">5</text><text x="432" y="554" font-family="Figtree, Arial, sans-serif" font-size="17" fill="#25201B">Whole body and club in frame</text><text x="400" y="596" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#62584D">6</text><text x="432" y="596" font-family="Figtree, Arial, sans-serif" font-size="17" fill="#25201B">One swing per clip</text><text x="432" y="646" font-family="Figtree, Arial, sans-serif" font-size="15" font-weight="600" fill="#A4462A" text-decoration="underline">Open the filming guide</text><rect x="400" y="740" width="640" height="170" fill="#EBE3D5" rx="20"/><rect x="610" y="784" width="220" height="56" rx="28" fill="#A4462A"/><text x="720" y="817.95" font-family="Figtree, Arial, sans-serif" font-size="17" font-weight="600" fill="#F4EFE6" text-anchor="middle">Choose swing clip</text><text x="720" y="874" font-family="Figtree, Arial, sans-serif" font-size="14" fill="#62584D" text-anchor="middle">or drop it here  ·  mp4 or mov  ·  max 15 s</text><rect x="400" y="942" width="44" height="26" rx="13" fill="#EBE3D5"/><circle cx="413" cy="955" r="10" fill="#FFFCF6"/><text x="462" y="960" font-family="Figtree, Arial, sans-serif" font-size="16" font-weight="600" fill="#25201B">Save to my swing library</text><text x="462" y="984" font-family="Figtree, Arial, sans-serif" font-size="14" fill="#62584D">Off. If on, the clip is stored on the AIcoach server until you delete it.</text><line x1="0" y1="1080" x2="1440" y2="1080" stroke="#EBE3D5" stroke-width="2" /><text x="40" y="1220" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="700" fill="#62584D">Analysing</text><text x="40" y="1240" font-family="Figtree, Arial, sans-serif" font-size="13" fill="#62584D">The figure draws itself as each step lands.</text><circle cx="414" cy="1140" r="14.3" fill="#A4462A"/><path d="M410.42 1147.15 L410.42 1132.13 L420.43 1135.71 L410.42 1139.29" fill="#F4EFE6" stroke="#F4EFE6" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round"/><path d="M405.42 1147.44 Q414 1144.29 422.58 1147.44" fill="none" stroke="#F4EFE6" stroke-width="1.43" stroke-linecap="round"/><text x="434.8" y="1148.32" font-family="Newsreader, Georgia, serif" font-size="26" font-weight="600" fill="#25201B"><tspan fill="#A4462A" font-style="italic">AI</tspan><tspan>coach</tspan></text><text x="988" y="1146" font-family="Figtree, Arial, sans-serif" font-size="15" fill="#62584D" text-anchor="end">Swing library</text><circle cx="1024" cy="1140" r="16" fill="#EBE3D5"/><text x="1024" y="1145" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600" fill="#25201B" text-anchor="middle">R</text><text x="400" y="1270" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" fill="#62584D">7-iron_dtl.mov  ·  3.8 s  ·  120 fps  ·  not saved</text><text x="400" y="1324" font-family="Newsreader, Georgia, serif" font-size="40" fill="#25201B">Watching now.</text><text x="400" y="1364" font-family="Newsreader, Georgia, serif" font-size="20" fill="#62584D">About a minute. You can put the phone down.</text><line x1="564.9" y1="1764" x2="868.5" y2="1764" stroke="#62584D" stroke-width="1" opacity="0.5"/><path d="M711.8 1518.2L687.7 1540.9M687.7 1540.9L617.7 1599M6