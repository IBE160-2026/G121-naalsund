ll="#A4462A" text-anchor="end">measuring</text><path d="M400 1838 l4.5 4.5 l8.5 -9" fill="none" stroke="#2D6A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="432" y="1844" font-family="Figtree, Arial, sans-serif" font-size="17" font-weight="400" fill="#25201B">Pose</text><text x="1040" y="1844" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" fill="#1E5368" text-anchor="end">456 of 456 frames</text><path d="M400 1882 l4.5 4.5 l8.5 -9" fill="none" stroke="#2D6A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="432" y="1888" font-family="Figtree, Arial, sans-serif" font-size="17" font-weight="400" fill="#25201B">Swing events</text><text x="1040" y="1888" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" fill="#1E5368" text-anchor="end">address 0.86 s · impact 2.07 s</text><circle cx="407" cy="1927" r="6" fill="none" stroke="#A4462A" stroke-width="2"/><circle cx="407" cy="1927" r="2.5" fill="#A4462A"/><text x="432" y="1932" font-family="Figtree, Arial, sans-serif" font-size="17" font-weight="600" fill="#25201B">Measurements</text><text x="1040" y="1932" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" fill="#1E5368" text-anchor="end">hips · posture · hand path</text><circle cx="407" cy="1971" r="5" fill="none" stroke="#62584D" stroke-width="1.2" opacity="0.6"/><text x="432" y="1976" font-family="Figtree, Arial, sans-serif" font-size="17" font-weight="400" fill="#62584D" opacity="0.75">Rule table</text><text x="1040" y="1976" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" fill="#62584D" text-anchor="end" opacity="0.75">3 faults</text><circle cx="407" cy="2015" r="5" fill="none" stroke="#62584D" stroke-width="1.2" opacity="0.6"/><text x="432" y="2020" font-family="Figtree, Arial, sans-serif" font-size="17" font-weight="400" fill="#62584D" opacity="0.75">Explanation</text><text x="1040" y="2020" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" fill="#62584D" text-anchor="end" opacity="0.75">from these numbers only</text><rect x="400" y="2074" width="640" height="3" fill="#EBE3D5" rx="1.5"/><rect x="400" y="2074" width="330" height="3" fill="#A4462A" rx="1.5"/><text x="400" y="2118" font-family="Figtree, Arial, sans-serif" font-size="14" fill="#62584D">You can ask the coach once the result is ready.</text></svg>
